[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "talkie-sdk"
version = "1.0.0"
description = "Official Python SDK for Talkie AI Voice & Messaging Platform"
readme = "README.md"
authors = [{ name = "Talkie Engineering", email = "dev@talkie.ai" }]
requires-python = ">=3.9"
dependencies = [
    "httpx>=0.25.0",
    "pydantic>=2.0.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0"
]
